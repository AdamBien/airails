# Builds one zip per supported AI agent with the agent's home-relative skill
# directory baked into the entry paths, so installation is a single command:
#
#   unzip airails-claude.zip -d ~
#
# The zips are the "no JDK, no questions asked" install tier; ./installSkills
# remains the managed, interactive path. The agent/prefix matrix and the noise
# filter live in ./zipSkills, which mirrors targets() and isNoise() in
# installSkills.
name: release-skills

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two rapid pushes must not interleave the delete/recreate of the rolling
# release — later run supersedes earlier ones.
concurrency:
  group: release-skills
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Invalid frontmatter (e.g. an unquoted ': ' in a description) makes
      # strict YAML parsers skip the skill — never publish such a release.
      - name: Validate skills
        run: ./checkSkills

      - name: Build per-agent zips
        run: ./zipSkills

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete skills --yes --cleanup-tag || true
          gh release create skills target/*.zip \
            --title "skills ($(date -u +%Y.%m.%d))" \
            --notes "Per-agent skill zips built from ${GITHUB_SHA}.

          Install by unzipping into your home directory, e.g.:

          \`\`\`
          unzip airails-claude.zip -d ~
          \`\`\`

          Each zip contains the same skills under the agent's directory: claude (.claude/skills), vibe (.vibe/skills), kiro (.kiro/skills), copilot (.copilot/skills), codex (.agents/skills), goose (.config/goose/skills).

          \`airails-skills.zip\` is agent-neutral: the same skills under a plain \`skills/\` prefix, for agents not listed above or for manual installs into a custom location.

          Bundles are agent-neutral subsets in the same \`skills/\` layout — unzip into the agent's skills directory (e.g. \`unzip airails-web.zip -d ~/.claude/skills\`). Stack bundles share a core of bce, bce-reviewer, system-tests and the documentation skills (readme, bce-diagrams, mermaid, drawio): \`airails-java-server.zip\` (MicroProfile/Jakarta EE), \`airails-java-cli.zip\` (Java CLI apps and scripts with the z* building blocks), \`airails-web.zip\` (static sites, sprinkles, web components), \`airails-migrations.zip\` (legacy migration), \`airails-fullstack.zip\` (the sbce, documentation, java-server and web bundles combined). Add-on for any stack: \`airails-sbce.zip\` (spec-driven workflow: sbce, ears-tests, capability-brief, system-brief). \`airails-documentation.zip\` (readme, bce-diagrams, mermaid, drawio) is already inside every stack bundle and ships standalone for custom installs.

          Note: unzipping overwrites existing skills of the same name without asking. For an interactive, managed install use \`./installSkills\` from the cloned repository."
